name: Update feed

on:
  schedule:
    - cron: "17 */6 * * *"   # tiap 6 jam
  workflow_dispatch:          # bisa dijalankan manual dari tab Actions
  push:
    paths:
      - "fetch_feeds.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feedparser
        run: pip install feedparser

      - name: Tarik feed terbaru + buat ringkasan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_feeds.py

      - name: Simpan hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898338+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update feed otomatis" && git push)
